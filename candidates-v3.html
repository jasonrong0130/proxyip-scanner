<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>ProxyIP 多源候选池 V3</title>
<style>
:root{color-scheme:light;--bg:#f4f6fa;--card:#fff;--text:#0f172a;--muted:#64748b;--line:#e2e8f0;--ok:#0f8a5f;--warn:#b7791f;--bad:#c2414b;--accent:#171a21}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}.wrap{max-width:1500px;margin:auto;padding:24px 20px 40px}.top{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-bottom:16px}.title{font-size:23px;font-weight:800}.sub,.note{color:var(--muted);font-size:12px}.actions{display:flex;gap:8px;flex-wrap:wrap}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:14px;box-shadow:0 10px 28px rgba(15,23,42,.05)}button{border:0;border-radius:10px;padding:10px 14px;background:var(--accent);color:#fff;font-weight:700;cursor:pointer}button.secondary{background:#eef2f6;color:#263244;border:1px solid #e2e8f0}button.danger{background:#fff;color:var(--bad);border:1px solid #f0c7cb}button:disabled{opacity:.45;cursor:not-allowed}.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:12px}.c12{grid-column:span 12}.c6{grid-column:span 6}.c4{grid-column:span 4}.c3{grid-column:span 3}.c2{grid-column:span 2}label{display:block;color:#536176;font-size:12px;font-weight:700;margin-bottom:7px}input,select,textarea{width:100%;border:1px solid #d8dee8;border-radius:10px;padding:10px 11px;background:#fff;outline:none}textarea{min-height:230px;resize:vertical;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;line-height:1.55}.checks{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.checks label{display:flex;align-items:flex-start;gap:8px;margin:0;padding:10px 11px;border:1px solid var(--line);border-radius:10px;background:#fafbfd;color:#334155}.checks input{width:auto;margin-top:3px}.stats{display:grid;grid-template-columns:repeat(6,1fr);gap:9px}.stat{border:1px solid var(--line);border-radius:12px;padding:12px;background:#fafbfd}.stat b{display:block;font-size:21px}.stat span{color:var(--muted);font-size:11px}.ok{color:var(--ok);font-weight:750}.warn{color:var(--warn);font-weight:750}.bad{color:var(--bad);font-weight:750}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:12px;background:#fff}table{border-collapse:collapse;width:100%;min-width:1180px}th,td{padding:9px 10px;border-bottom:1px solid #edf0f3;text-align:left;white-space:nowrap}th{background:#f8fafc;font-size:11px;color:#5d6b7f;position:sticky;top:0}.sourceTable{min-width:760px}.status{padding:10px 12px;border-radius:10px;background:#f8fafc;border:1px solid var(--line);font-size:12px}.pill{display:inline-flex;padding:4px 8px;border-radius:999px;background:#eef2f6;color:#475569;font-size:11px;font-weight:700}.hidden{display:none!important}.toolbar{display:flex;align-items:end;gap:8px;flex-wrap:wrap;margin-bottom:10px}.toolbar>div{min-width:150px}.endpoint{display:flex;flex-direction:column;gap:2px}.endpoint .ip{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}.endpoint .place{font-size:11px;color:#64748b}.error-cell{max-width:240px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.source-tag{font-size:11px;color:#64748b;max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.row-good{background:#fbfffd}.source-actions button{padding:6px 9px;font-size:11px}.section-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}.section-title{font-size:16px;font-weight:800}.custom-empty{padding:18px;text-align:center;color:var(--muted)}@media(max-width:900px){.c6,.c4,.c3,.c2{grid-column:span 12}.checks{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}.wrap{padding:14px 10px 28px}.top{align-items:flex-start;flex-direction:column}}
</style>
</head>
<body>
<div class="wrap">
<div class="top"><div><div class="title">ProxyIP 多源候选池 V3</div><div class="sub">内置源 + 我的源；最终可用仍以 EDT Probe 真连接结果为准。</div></div><div class="actions"><button class="secondary" onclick="location.href='/'">返回正式扫描器</button><button class="secondary" onclick="location.href='/static/candidates-v2.html'">V2</button></div></div>
<div id="authWarn" class="card hidden"><div class="bad">尚未登录 Scanner。</div></div>
<div id="main" class="hidden">
<div class="card"><div class="grid">
<div class="c3"><label>地区</label><select id="region"><option value="HK">香港 HK</option><option value="JP">日本 JP</option><option value="SG">新加坡 SG</option><option value="KR">韩国 KR</option><option value="US">美国 US</option><option value="DE">德国 DE</option><option value="ALL">全球 ALL</option></select></div>
<div class="c3"><label>最多导入</label><select id="limit"><option value="200">200</option><option value="500" selected>500</option><option value="1000">1000</option><option value="2000">2000</option><option value="0">全部</option></select></div>
<div class="c3"><label>快速检测并发</label><select id="concurrency"><option>20</option><option selected>50</option><option>100</option><option>200</option></select></div>
<div class="c3"><label>端口策略</label><select id="portPolicy"><option value="keep" selected>保留来源端口</option><option value="443">只保留 443</option><option value="force443">统一改成 443</option></select></div>
<div class="c6"><label>检测 SNI</label><input id="sni" placeholder="vpn.rongxiaofeng.top" /></div>
<div class="c6"><label>候选策略</label><select id="candidateMode"><option value="region" selected>优先地区匹配源</option><option value="broad">地区源 + 全球动态源</option></select></div>
<div class="c12"><label>内置源</label><div class="checks">
<label><input id="srcCountry" type="checkbox" checked /><span><b>NiREvil 地区列表</b><br><span class="note">地区专用 IP:Port</span></span></label>
<label><input id="srcDaily" type="checkbox" checked /><span><b>NiREvil Daily</b><br><span class="note">每日公开池</span></span></label>
<label><input id="srcCmliu" type="checkbox" checked /><span><b>CMliu 地区域名</b><br><span class="note">地区动态 DNS A 记录</span></span></label>
<label><input id="srcDynamic" type="checkbox" checked /><span><b>EDT 动态域名组</b><br><span class="note">公开 ProxyIP 动态域名集合</span></span></label>
<label><input id="srcLeilao" type="checkbox" /><span><b>LeilaoMi 池</b><br><span class="note">US / ALL 建议启用</span></span></label>
</div><div class="note" style="margin-top:8px">已移除失效的 cf-bestip HK 默认源。</div></div>
<div class="c12"><div class="actions"><button id="fetchBtn">获取全部候选</button><button id="scanBtn" disabled>开始 EDT 真连接筛选</button><button id="copyCandidatesBtn" class="secondary" disabled>复制候选</button></div></div>
<div class="c12"><div id="sourceStatus" class="status">等待获取候选。</div></div>
<div class="c6"><label>候选列表</label><textarea id="candidates" placeholder="候选会显示在这里"></textarea><div class="note">实际扫描使用完整去重候选集合。</div></div>
<div class="c6"><label>来源统计</label><div class="tablewrap"><table class="sourceTable"><thead><tr><th>来源</th><th>原始</th><th>贡献去重</th><th>状态</th></tr></thead><tbody id="sourceBody"></tbody></table></div></div>
</div></div>

<div class="card">
<div class="section-head"><div><div class="section-title">我的源</div><div class="note">测试版先保存在当前浏览器；正式合并时迁移到 Scanner 服务器数据目录。</div></div><button id="showAddBtn" class="secondary">+ 添加候选源</button></div>
<div id="addBox" class="grid hidden" style="margin-bottom:14px">
<div class="c3"><label>名称</label><input id="customName" placeholder="例如 我的香港源" /></div>
<div class="c2"><label>类型</label><select id="customType"><option value="url">URL 文本</option><option value="dns">DNS A 记录</option></select></div>
<div class="c2"><label>地区</label><select id="customRegion"><option value="HK">香港 HK</option><option value="JP">日本 JP</option><option value="SG">新加坡 SG</option><option value="KR">韩国 KR</option><option value="US">美国 US</option><option value="DE">德国 DE</option><option value="ALL">全球 ALL</option></select></div>
<div class="c4"><label>地址 / 域名</label><input id="customValue" placeholder="https://.../proxy.txt 或 proxy.example.com" /></div>
<div class="c12 actions"><button id="saveCustomBtn">保存</button><button id="cancelCustomBtn" class="secondary">取消</button></div>
</div>
<div class="tablewrap"><table><thead><tr><th>启用</th><th>名称</th><th>类型</th><th>地区</th><th>地址</th><th>最后状态</th><th>最近数量</th><th>连续失败</th><th>操作</th></tr></thead><tbody id="customBody"></tbody></table></div>
</div>

<div class="card"><div class="stats"><div class="stat"><b id="stTotal">0</b><span>总数</span></div><div class="stat"><b id="stDone">0</b><span>一级已检测</span></div><div class="stat"><b id="stFinal">0</b><span>最终可用</span></div><div class="stat"><b id="stRuntime">0/0</b><span>EDT 真连接</span></div><div class="stat"><b id="stState">-</b><span>任务状态</span></div><div class="stat"><b id="stJob">-</b><span>任务 ID</span></div></div><div class="actions" style="margin-top:12px"><button id="stopBtn" class="secondary" disabled>停止任务</button><button id="copyGoodBtn" class="secondary" disabled>复制最终可用</button></div></div>

<div class="card"><div style="display:flex;align-items:center;gap:8px;margin-bottom:10px"><b>最终结果</b><span class="pill">入口 / 出口分开显示</span><span class="pill">错误缩略</span></div><div class="toolbar"><div><label>结果筛选</label><select id="resultFilter"><option value="all">全部</option><option value="available">仅最终可用</option><option value="failed">仅失败</option></select></div><div><label>排序</label><select id="resultSort"><option value="original">原顺序</option><option value="tcp">TCP 延迟升序</option><option value="tls">TLS 延迟升序</option></select></div><span id="resultCount" class="note"></span></div><div class="tablewrap"><table><thead><tr><th>#</th><th>ProxyIP</th><th>最终</th><th>EDT</th><th>CF</th><th>TCP</th><th>TLS</th><th>入口</th><th>出口</th><th>CF机房</th><th>来源</th><th>错误</th></tr></thead><tbody id="tbody"></tbody></table></div></div>
</div></div>
<script>
let csrf='',cfg=null,allCandidates=[],jobId=null,timer=null,current=null,candidateMeta={},editCustomIndex=null;
const $=id=>document.getElementById(id),RAW='https://raw.githubusercontent.com/';
const STORAGE_KEY='proxyip-custom-sources-v1';
const CMLIU={ALL:'proxyip.cmliussss.net',HK:'ProxyIP.HK.CMLiussss.net',JP:'ProxyIP.JP.CMLiussss.net',SG:'ProxyIP.SG.CMLiussss.net',KR:'ProxyIP.KR.CMLiussss.net',US:'ProxyIP.US.CMLiussss.net',DE:'ProxyIP.DE.CMLiussss.net'};
const DYNAMIC_DOMAINS=['proxyip.cmliussss.net','pyip.ygkkk.dpdns.org','proxy.farel.is-a.dev','proxyip.leilaomi.cc.cd','proxyip.oracle.fxxk.dedyn.io','proxyip.digitalocean.hw.090227.xyz','proxyip.vultr.fxxk.dedyn.io','proxyip.aliyun.hw.090227.xyz','edtproxyip.lzj.pp.ua','cdn.xn--b6gac.eu.org','cdn-all.xn--b6gac.eu.org','di.nscl.ir','tr.diam4.ggff.net','bpb.yousef.isegaro.com'];
const REGION_WORDS={HK:['hong kong','hkg'],JP:['japan','tokyo','osaka','chiba','saitama','kanagawa','aichi','fukuoka'],SG:['singapore','sin'],KR:['south korea','korea','seoul','incheon'],US:['united states','usa','california','virginia','oregon','ohio','iowa','new york','texas','washington','illinois'],DE:['germany','frankfurt','berlin','bavaria','hesse']};
const COUNTRY_ZH={HK:'香港',JP:'日本',SG:'新加坡',KR:'韩国',US:'美国',DE:'德国',CN:'中国大陆',TW:'台湾',MO:'澳门',CA:'加拿大',GB:'英国',FR:'法国',NL:'荷兰',AU:'澳大利亚'};
const COLO_ZH={HKG:'香港',NRT:'东京',KIX:'大阪',ICN:'首尔',SIN:'新加坡',TPE:'台北',SJC:'圣何塞',LAX:'洛杉矶',SEA:'西雅图',FRA:'法兰克福',AMS:'阿姆斯特丹',LHR:'伦敦'};
const STATE_ZH={queued:'排队中',checking:'一级检测中',runtime_checking:'EDT 真连接检测中',speeding:'测速中',completed:'已完成',cancelled:'已停止',interrupted:'已中断'};
function esc(v){return String(v??'').replace(/[&<>"']/g,s=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]));}
function countryZh(v){if(!v)return '未识别';const k=String(v).toUpperCase();return COUNTRY_ZH[k]||k;}
function coloZh(v){if(!v)return '-';const k=String(v).toUpperCase();return COLO_ZH[k]?COLO_ZH[k]+'（'+k+'）':k;}
function stateZh(v){if(!v)return '-';return STATE_ZH[v]||v;}
async function api(path,opt={}){const headers={'Content-Type':'application/json',...(opt.headers||{})};if(csrf&&opt.method&&opt.method!=='GET')headers['x-csrf-token']=csrf;const r=await fetch(path,{credentials:'same-origin',...opt,headers});const text=await r.text();let data={};try{data=text?JSON.parse(text):{};}catch{data={detail:text};}if(!r.ok)throw new Error(data.detail||('HTTP '+r.status));return data;}
function validIp(ip){const p=String(ip).trim().split('.');return p.length===4&&p.every(x=>/^\d{1,3}$/.test(x)&&Number(x)>=0&&Number(x)<=255);}
function normalize(ip,port){if(!validIp(ip))return null;const n=Number(port||443);if(n<1||n>65535)return null;return ip+':'+n;}
function parseLoose(text){const out=[];const re=/(\d{1,3}(?:\.\d{1,3}){3})(?::(\d{1,5}))?/g;let m;while((m=re.exec(String(text||'')))!==null){const n=normalize(m[1],m[2]||443);if(n)out.push(n);}return out;}
function parseCountry(text){return parseLoose(text);}
function parseDaily(text,region){const out=[];const words=REGION_WORDS[region]||[];for(const line of String(text||'').split(/\r?\n/)){const m=line.match(/<pre><code>(\d{1,3}(?:\.\d{1,3}){3})<\/code><\/pre>/i);if(!m)continue;if(region!=='ALL'&&words.length&&!words.some(w=>line.toLowerCase().includes(w)))continue;const n=normalize(m[1],443);if(n)out.push(n);}return out;}
function applyPortPolicy(list){const mode=$('portPolicy').value;return list.map(x=>{const m=x.match(/^(\d+(?:\.\d+){3}):(\d+)$/);if(!m)return null;if(mode==='443'&&m[2]!=='443')return null;if(mode==='force443')return m[1]+':443';return x;}).filter(Boolean);}
function dedupe(list){const seen=new Set(),out=[];for(const x of list){const v=String(x||'').trim(),k=v.toLowerCase();if(!v||seen.has(k))continue;seen.add(k);out.push(v);}return out;}
async function fetchText(url){const r=await fetch(url,{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);return r.text();}
async function resolveDns(host){const url='https://cloudflare-dns.com/dns-query?name='+encodeURIComponent(host)+'&type=A';const r=await fetch(url,{headers:{Accept:'application/dns-json'},cache:'no-store'});if(!r.ok)throw new Error('DoH '+r.status);const d=await r.json();return dedupe((d.Answer||[]).map(x=>String(x.data||'').trim()).filter(validIp).map(x=>x+':443'));}
async function resolveDomains(domains){const rows=await Promise.allSettled(domains.map(resolveDns));return dedupe(rows.filter(x=>x.status==='fulfilled').flatMap(x=>x.value));}
async function oneSource(name,regionHint,fn){try{const items=dedupe(applyPortPolicy(await fn()));return {name,regionHint,items,raw:items.length,status:'ok'};}catch(e){return {name,regionHint,items:[],raw:0,status:e.message||String(e)};}}
function loadCustom(){try{const v=JSON.parse(localStorage.getItem(STORAGE_KEY)||'[]');return Array.isArray(v)?v:[];}catch{return [];}}
function saveCustom(rows){localStorage.setItem(STORAGE_KEY,JSON.stringify(rows));}
function resetCustomForm(){editCustomIndex=null;$('customName').value='';$('customValue').value='';$('customType').value='url';$('customRegion').value='HK';$('saveCustomBtn').textContent='保存';$('addBox').classList.add('hidden');}
function inferCustomType(value,current){const v=String(value||'').trim();if(/^https?:\/\//i.test(v))return 'url';if(/^[A-Za-z0-9.-]+\.?$/.test(v)&&v.includes('.'))return 'dns';return current||'url';}
function renderCustom(){const rows=loadCustom();if(!rows.length){$('customBody').innerHTML='<tr><td colspan="9" class="custom-empty">还没有自定义源</td></tr>';return;}$('customBody').innerHTML=rows.map((r,i)=>'<tr><td><input type="checkbox" data-act="toggle" data-i="'+i+'" '+(r.enabled!==false?'checked':'')+'></td><td>'+esc(r.name)+'</td><td>'+(r.type==='dns'?'DNS':'URL')+'</td><td>'+esc(r.region)+'</td><td class="mono" title="'+esc(r.value)+'">'+esc(String(r.value).slice(0,48))+(String(r.value).length>48?'…':'')+'</td><td class="'+(r.lastStatus==='ok'?'ok':r.failures>=3?'bad':'warn')+'">'+esc(r.lastStatus||'-')+'</td><td>'+esc(r.lastCount??'-')+'</td><td>'+Number(r.failures||0)+'</td><td class="source-actions"><button class="secondary" data-act="test" data-i="'+i+'">测试</button> <button class="secondary" data-act="edit" data-i="'+i+'">编辑</button> <button class="danger" data-act="delete" data-i="'+i+'">删除</button></td></tr>').join('');document.querySelectorAll('[data-act]').forEach(el=>el.onclick=customAction);}
async function customAction(e){const el=e.currentTarget,i=Number(el.dataset.i),act=el.dataset.act,rows=loadCustom(),r=rows[i];if(!r)return;if(act==='toggle'){r.enabled=el.checked;saveCustom(rows);return;}if(act==='edit'){editCustomIndex=i;$('customName').value=r.name||'';$('customType').value=r.type||'url';$('customRegion').value=r.region||'ALL';$('customValue').value=r.value||'';$('saveCustomBtn').textContent='保存修改';$('addBox').classList.remove('hidden');$('addBox').scrollIntoView({behavior:'smooth',block:'center'});return;}if(act==='delete'){if(editCustomIndex===i)resetCustomForm();rows.splice(i,1);saveCustom(rows);renderCustom();return;}if(act==='test'){el.disabled=true;try{const items=r.type==='dns'?await resolveDns(r.value):parseLoose(await fetchText(r.value));r.lastStatus='ok';r.lastCount=items.length;r.failures=0;alert('测试成功：解析 '+items.length+' 条');}catch(err){r.failures=Number(r.failures||0)+1;r.lastStatus=err.message||String(err);if(r.failures>=3)r.enabled=false;alert('测试失败：'+r.lastStatus);}finally{saveCustom(rows);renderCustom();el.disabled=false;}}}
$('showAddBtn').onclick=()=>{resetCustomForm();$('addBox').classList.remove('hidden');};$('cancelCustomBtn').onclick=resetCustomForm;$('customValue').oninput=()=>{$('customType').value=inferCustomType($('customValue').value,$('customType').value);};$('saveCustomBtn').onclick=()=>{const name=$('customName').value.trim(),region=$('customRegion').value,value=$('customValue').value.trim();if(!name||!value)return alert('名称和地址不能为空');const type=inferCustomType(value,$('customType').value);$('customType').value=type;const rows=loadCustom(),base={name,type,region,value,enabled:true,failures:0,lastStatus:'-',lastCount:null};if(editCustomIndex!==null&&rows[editCustomIndex]){base.enabled=rows[editCustomIndex].enabled!==false;rows[editCustomIndex]=base;}else{rows.push(base);}saveCustom(rows);resetCustomForm();renderCustom();};
function renderSourceStats(rows){const seen=new Set();$('sourceBody').innerHTML=rows.map(row=>{let contributed=0;for(const x of row.items){const k=x.toLowerCase();if(!seen.has(k)){seen.add(k);contributed++;}}const st=row.status==='ok'?'<span class="ok">正常</span>':'<span class="bad">'+esc(row.status)+'</span>';return '<tr><td>'+esc(row.name)+'</td><td>'+row.raw+'</td><td>'+contributed+'</td><td>'+st+'</td></tr>';}).join('');}
function buildCandidateMeta(rows){candidateMeta={};for(const row of rows){for(const item of row.items){const k=item.toLowerCase();if(!candidateMeta[k])candidateMeta[k]={sources:[],regionHints:[]};if(!candidateMeta[k].sources.includes(row.name))candidateMeta[k].sources.push(row.name);if(row.regionHint&&!candidateMeta[k].regionHints.includes(row.regionHint))candidateMeta[k].regionHints.push(row.regionHint);}}}
async function customWorks(region){const saved=loadCustom(),works=[];for(let i=0;i<saved.length;i++){const r=saved[i];if(r.enabled===false)continue;if(r.region!=='ALL'&&region!=='ALL'&&r.region!==region)continue;works.push(oneSource('我的源 · '+r.name,r.region==='ALL'?null:r.region,async()=>{try{const items=r.type==='dns'?await resolveDns(r.value):parseLoose(await fetchText(r.value));r.lastStatus='ok';r.lastCount=items.length;r.failures=0;return items;}catch(err){r.failures=Number(r.failures||0)+1;r.lastStatus=err.message||String(err);if(r.failures>=3)r.enabled=false;throw err;}finally{saved[i]=r;saveCustom(saved);renderCustom();}}));}return works;}
async function loadCandidates(){const region=$('region').value,mode=$('candidateMode').value,work=[];$('fetchBtn').disabled=true;$('scanBtn').disabled=true;$('sourceStatus').textContent='正在并行读取候选源…';try{if($('srcCountry').checked&&region!=='ALL')work.push(oneSource('NiREvil '+region,region,async()=>parseCountry(await fetchText(RAW+'NiREvil/vless/main/sub/country_proxies/'+region+'.txt'))));if($('srcDaily').checked)work.push(oneSource('NiREvil Daily',region==='ALL'?null:region,async()=>parseDaily(await fetchText(RAW+'NiREvil/vless/main/sub/ProxyIP-Daily.md'),region)));if($('srcCmliu').checked)work.push(oneSource('CMliu '+region,region==='ALL'?null:region,async()=>resolveDns(CMLIU[region]||CMLIU.ALL)));if($('srcDynamic').checked&&(mode==='broad'||region==='ALL'||region==='HK'))work.push(oneSource('EDT 动态域名组',null,async()=>resolveDomains(DYNAMIC_DOMAINS)));if($('srcLeilao').checked&&(region==='US'||region==='ALL'))work.push(oneSource('LeilaoMi all/best',region==='US'?'US':null,async()=>parseLoose((await fetchText('https://list.leilaomi.cc.cd/all.txt'))+'\n'+(await fetchText('https://list.leilaomi.cc.cd/best.txt')))));work.push(...await customWorks(region));const rows=await Promise.all(work);renderSourceStats(rows);buildCandidateMeta(rows);let list=dedupe(rows.flatMap(r=>r.items));const limit=Number($('limit').value||0);if(limit>0)list=list.slice(0,limit);allCandidates=list;$('candidates').value=list.length<=300?list.join('\n'):list.slice(0,300).join('\n')+'\n\n… 仅预览前 300 条，实际共 '+list.length+' 条';$('scanBtn').disabled=!list.length;$('copyCandidatesBtn').disabled=!list.length;const failed=rows.filter(r=>r.status!=='ok').length;$('sourceStatus').innerHTML='获取完成：<b>'+list.length+'</b> 条去重候选；来源 '+rows.length+' 个，失败 '+failed+' 个。';}catch(e){allCandidates=[];$('sourceStatus').innerHTML='<span class="bad">获取失败：'+esc(e.message)+'</span>';}finally{$('fetchBtn').disabled=false;}}
async function startScan(){if(!allCandidates.length)return;const sni=$('sni').value.trim();if(!sni)return alert('请填写检测 SNI');$('scanBtn').disabled=true;try{const body={targets:allCandidates.join('\n'),probe_sni:sni,probe_path:cfg.default_probe_path||'/cdn-cgi/trace',generic_sni:'',expect_cloudflare:true,check_concurrency:Number($('concurrency').value),timeout:7,edt_runtime:{enabled:true},speed:{enabled:false}};const d=await api('/api/jobs',{method:'POST',body:JSON.stringify(body)});jobId=d.id;$('stJob').textContent=jobId;clearInterval(timer);poll();timer=setInterval(poll,1000);}catch(e){alert('创建任务失败：'+e.message);$('scanBtn').disabled=false;}}
async function poll(){if(!jobId)return;try{current=await api('/api/jobs/'+jobId);render();if(['completed','cancelled','interrupted'].includes(current.state)){clearInterval(timer);timer=null;$('scanBtn').disabled=false;}}catch(e){clearInterval(timer);timer=null;$('scanBtn').disabled=false;}}
function mark(v){return v===true?'<span class="ok">✓</span>':v===false?'<span class="bad">×</span>':'-';}
function entrancePlace(r){const meta=candidateMeta[String(r.candidate||'').toLowerCase()];if(meta?.regionHints?.length)return countryZh(meta.regionHints[0]);if(r.exit_match==='same'&&r.country)return countryZh(r.country);return '未识别';}
function sourceText(r){const meta=candidateMeta[String(r.candidate||'').toLowerCase()];return meta?.sources?.join(' / ')||'-';}
function endpointHtml(ip,place){return '<div class="endpoint"><span class="ip">'+esc(ip||'-')+'</span><span class="place">'+esc(place||'未识别')+'</span></div>';}
function filteredRows(){let rows=(current?.results||[]).map((r,i)=>({...r,_i:i})).filter(r=>r.final_available!==null&&r.final_available!==undefined);const f=$('resultFilter').value;if(f==='available')rows=rows.filter(r=>r.final_available===true);if(f==='failed')rows=rows.filter(r=>r.final_available===false);const s=$('resultSort').value;if(s==='tcp')rows.sort((a,b)=>(a.tcp_ms??1e12)-(b.tcp_ms??1e12));if(s==='tls')rows.sort((a,b)=>(a.tls_ms??1e12)-(b.tls_ms??1e12));return rows;}
function renderResults(){const rows=filteredRows();$('resultCount').textContent='当前 '+rows.length+' 条';$('tbody').innerHTML=rows.slice(0,1000).map(r=>{const err=r.error||'',short=err.length>34?err.slice(0,34)+'…':err;return '<tr class="'+(r.final_available===true?'row-good':'')+'"><td>'+(r._i+1)+'</td><td class="mono">'+esc(r.candidate||r.input)+'</td><td>'+mark(r.final_available)+'</td><td>'+mark(r.edt_available)+'</td><td>'+mark(r.cloudflare_reached)+'</td><td>'+esc(r.tcp_ms??'-')+'</td><td>'+esc(r.tls_ms??'-')+'</td><td>'+endpointHtml(r.host||'-',entrancePlace(r))+'</td><td>'+endpointHtml(r.exit_ip||'-',countryZh(r.country))+'</td><td>'+esc(coloZh(r.colo))+'</td><td><div class="source-tag" title="'+esc(sourceText(r))+'">'+esc(sourceText(r))+'</div></td><td class="error-cell '+(err?'bad':'')+'" title="'+esc(err)+'">'+esc(short||'-')+'</td></tr>';}).join('');}
function render(){const d=current||{};$('stTotal').textContent=d.total||0;$('stDone').textContent=d.completed||0;$('stFinal').textContent=d.final_available??d.available??0;$('stRuntime').textContent=(d.runtime_completed||0)+'/'+(d.runtime_total||0);$('stState').textContent=stateZh(d.state);$('stopBtn').disabled=!['queued','checking','runtime_checking','speeding'].includes(d.state);$('copyGoodBtn').disabled=!(d.results||[]).some(r=>r.final_available===true);renderResults();}
async function copyText(text){try{await navigator.clipboard.writeText(text);return true;}catch{const ta=document.createElement('textarea');ta.value=text;document.body.appendChild(ta);ta.select();const ok=document.execCommand('copy');ta.remove();return ok;}}
$('fetchBtn').onclick=loadCandidates;$('scanBtn').onclick=startScan;$('copyCandidatesBtn').onclick=async()=>{if(await copyText(allCandidates.join('\n')))alert('已复制 '+allCandidates.length+' 条候选');};$('copyGoodBtn').onclick=async()=>{const good=(current?.results||[]).filter(r=>r.final_available===true).map(r=>r.candidate);if(await copyText(good.join('\n')))alert('已复制 '+good.length+' 条最终可用');};$('stopBtn').onclick=async()=>{if(!jobId)return;try{await api('/api/jobs/'+jobId+'/cancel',{method:'POST'});}catch(e){alert(e.message);}};$('resultFilter').onchange=renderResults;$('resultSort').onchange=renderResults;
(async()=>{try{const me=await api('/api/auth/me',{method:'GET'});csrf=me.csrf||'';cfg=await api('/api/config',{method:'GET'});$('sni').value=cfg.default_probe_sni||'';$('main').classList.remove('hidden');renderCustom();}catch{$('authWarn').classList.remove('hidden');}})();
</script>
