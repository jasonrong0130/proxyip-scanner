<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>ProxyIP 多源候选池</title>
<style>
:root{color-scheme:light;--bg:#f4f6fa;--card:#fff;--text:#0f172a;--muted:#64748b;--line:#e2e8f0;--ok:#0f8a5f;--bad:#c2414b;--accent:#171a21}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}.wrap{max-width:1500px;margin:auto;padding:24px 20px 40px}.top{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-bottom:16px}.title{font-size:23px;font-weight:800}.sub{color:var(--muted);font-size:12px;margin-top:3px}.actions{display:flex;gap:8px;flex-wrap:wrap}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:14px;box-shadow:0 10px 28px rgba(15,23,42,.05)}button{border:0;border-radius:10px;padding:10px 14px;background:var(--accent);color:#fff;font-weight:700;cursor:pointer}button.secondary{background:#eef2f6;color:#263244;border:1px solid #e2e8f0}button:disabled{opacity:.45;cursor:not-allowed}.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:12px}.c12{grid-column:span 12}.c6{grid-column:span 6}.c3{grid-column:span 3}label{display:block;color:#536176;font-size:12px;font-weight:700;margin-bottom:7px}input,select,textarea{width:100%;border:1px solid #d8dee8;border-radius:10px;padding:10px 11px;background:#fff;outline:none}textarea{min-height:230px;resize:vertical;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;line-height:1.55}.checks{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.checks label{display:flex;align-items:flex-start;gap:8px;margin:0;padding:10px 11px;border:1px solid var(--line);border-radius:10px;background:#fafbfd;color:#334155}.checks input{width:auto;margin-top:3px}.note{font-size:12px;color:var(--muted)}.stats{display:grid;grid-template-columns:repeat(6,1fr);gap:9px}.stat{border:1px solid var(--line);border-radius:12px;padding:12px;background:#fafbfd}.stat b{display:block;font-size:21px}.stat span{color:var(--muted);font-size:11px}.ok{color:var(--ok);font-weight:750}.bad{color:var(--bad);font-weight:750}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:12px;background:#fff}table{border-collapse:collapse;width:100%;min-width:1320px}th,td{padding:9px 10px;border-bottom:1px solid #edf0f3;text-align:left;white-space:nowrap}th{background:#f8fafc;font-size:11px;color:#5d6b7f;position:sticky;top:0}.status{padding:10px 12px;border-radius:10px;background:#f8fafc;border:1px solid var(--line);font-size:12px}.sourceTable{min-width:760px}.sourceTable td:last-child{white-space:normal}.pill{display:inline-flex;padding:4px 8px;border-radius:999px;background:#eef2f6;color:#475569;font-size:11px;font-weight:700}.hidden{display:none!important}.toolbar{display:flex;align-items:end;gap:8px;flex-wrap:wrap;margin-bottom:10px}.toolbar>div{min-width:150px}.endpoint{display:flex;flex-direction:column;gap:2px}.endpoint .ip{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}.endpoint .place{font-size:11px;color:#64748b}.error-cell{max-width:280px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.error-empty{color:#94a3b8}.source-tag{font-size:11px;color:#64748b;max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.row-good{background:#fbfffd}
@media(max-width:900px){.c6,.c3{grid-column:span 12}.checks{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}.wrap{padding:14px 10px 28px}.top{align-items:flex-start;flex-direction:column}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><div><div class="title">ProxyIP 多源候选池</div><div class="sub">公开来源只负责提供候选；最终可用性仍以本站 EDT Probe 真连接 + 目标 TLS/HTTP 验证为准。</div></div><div class="actions"><button class="secondary" onclick="location.href='/'">返回正式扫描器</button><button class="secondary" onclick="location.href='/static/candidates.html'">旧测试页</button></div></div>
  <div id="authWarn" class="card hidden"><div class="bad">尚未登录 Scanner。</div><div class="note" style="margin-top:6px">请先返回主扫描器登录，再打开本页。</div></div>
  <div id="main" class="hidden">
    <div class="card"><div class="grid">
      <div class="c3"><label>地区</label><select id="region"><option value="HK">香港 HK</option><option value="JP">日本 JP</option><option value="SG">新加坡 SG</option><option value="KR">韩国 KR</option><option value="US">美国 US</option><option value="DE">德国 DE</option><option value="ALL">全球 ALL</option></select></div>
      <div class="c3"><label>最多导入</label><select id="limit"><option value="200">200</option><option value="500" selected>500</option><option value="1000">1000</option><option value="2000">2000</option><option value="0">全部</option></select></div>
      <div class="c3"><label>快速检测并发</label><select id="concurrency"><option>20</option><option selected>50</option><option>100</option><option>200</option></select></div>
      <div class="c3"><label>端口策略</label><select id="portPolicy"><option value="keep" selected>保留来源端口</option><option value="443">只保留 443</option><option value="force443">统一改成 443</option></select></div>
      <div class="c6"><label>检测 SNI</label><input id="sni" placeholder="vpn.rongxiaofeng.top" /></div>
      <div class="c6"><label>候选策略</label><select id="candidateMode"><option value="region" selected>优先地区匹配源</option><option value="broad">地区源 + 全球动态源</option></select></div>
      <div class="c12"><label>公开来源</label><div class="checks">
        <label><input id="srcCountry" type="checkbox" checked /><span><b>NiREvil 地区列表</b><br><span class="note">地区专用 IP:Port 列表</span></span></label>
        <label><input id="srcDaily" type="checkbox" checked /><span><b>NiREvil Daily</b><br><span class="note">每日扫描池；地区模式会按可识别地区筛选</span></span></label>
        <label><input id="srcCmliu" type="checkbox" checked /><span><b>CMliu 地区域名</b><br><span class="note">地区动态 DNS A 记录</span></span></label>
        <label><input id="srcDynamic" type="checkbox" checked /><span><b>EDT 动态域名组</b><br><span class="note">NiREvil 汇总的公开 ProxyIP 域名组</span></span></label>
        <label><input id="srcCfBest" type="checkbox" checked /><span><b>cf-bestip 地区代理</b><br><span class="note">低优先级候选，必须再过 EDT 真连接</span></span></label>
        <label><input id="srcLeilao" type="checkbox" /><span><b>LeilaoMi 池</b><br><span class="note">当前项目目标以 US 为主；US/ALL 建议启用</span></span></label>
      </div></div>
      <div class="c12"><div class="actions"><button id="fetchBtn">获取全部候选</button><button id="scanBtn" disabled>开始 EDT 真连接筛选</button><button id="copyCandidatesBtn" class="secondary" disabled>复制候选</button></div></div>
      <div class="c12"><div id="sourceStatus" class="status">等待获取候选。</div></div>
      <div class="c6"><label>候选列表</label><textarea id="candidates" placeholder="候选会显示在这里；超过 300 条只预览前 300 条。"></textarea><div class="note">实际扫描使用完整去重候选集合，不受预览条数限制。</div></div>
      <div class="c6"><label>来源统计</label><div class="tablewrap"><table class="sourceTable"><thead><tr><th>来源</th><th>原始</th><th>贡献去重</th><th>状态</th></tr></thead><tbody id="sourceBody"></tbody></table></div></div>
    </div></div>

    <div class="card"><div class="stats"><div class="stat"><b id="stTotal">0</b><span>总数</span></div><div class="stat"><b id="stDone">0</b><span>一级已检测</span></div><div class="stat"><b id="stFinal">0</b><span>最终可用</span></div><div class="stat"><b id="stRuntime">0/0</b><span>EDT 真连接</span></div><div class="stat"><b id="stState">-</b><span>任务状态</span></div><div class="stat"><b id="stJob">-</b><span>任务 ID</span></div></div><div class="actions" style="margin-top:12px"><button id="stopBtn" class="secondary" disabled>停止任务</button><button id="copyGoodBtn" class="secondary" disabled>复制最终可用</button></div></div>

    <div class="card">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:10px"><b>最终结果</b><span class="pill">入口 / 出口分开显示</span><span class="pill">错误默认折叠</span></div>
      <div class="toolbar"><div><label>结果筛选</label><select id="resultFilter"><option value="all">全部</option><option value="available">仅最终可用</option><option value="failed">仅失败</option></select></div><div><label>排序</label><select id="resultSort"><option value="original">原顺序</option><option value="tcp">TCP 延迟升序</option><option value="tls">TLS 延迟升序</option></select></div><span id="resultCount" class="note"></span></div>
      <div class="tablewrap"><table><thead><tr><th>#</th><th>ProxyIP</th><th>最终</th><th>EDT</th><th>CF</th><th>TCP</th><th>TLS</th><th>入口</th><th>出口</th><th>CF机房</th><th>来源</th><th>错误</th></tr></thead><tbody id="tbody"></tbody></table></div>
    </div>
  </div>
</div>
<script>
let csrf='',cfg=null,allCandidates=[],jobId=null,timer=null,current=null,candidateMeta={};
const $=id=>document.getElementById(id);
const RAW='https://raw.githubusercontent.com/';
const CMLIU={ALL:'proxyip.cmliussss.net',HK:'ProxyIP.HK.CMLiussss.net',JP:'ProxyIP.JP.CMLiussss.net',SG:'ProxyIP.SG.CMLiussss.net',KR:'ProxyIP.KR.CMLiussss.net',US:'ProxyIP.US.CMLiussss.net',DE:'ProxyIP.DE.CMLiussss.net'};
const DYNAMIC_DOMAINS=['proxyip.cmliussss.net','pyip.ygkkk.dpdns.org','proxy.farel.is-a.dev','proxyip.leilaomi.cc.cd','proxyip.oracle.fxxk.dedyn.io','proxyip.digitalocean.hw.090227.xyz','proxyip.vultr.fxxk.dedyn.io','proxyip.aliyun.hw.090227.xyz','edtproxyip.lzj.pp.ua','cdn.xn--b6gac.eu.org','cdn-all.xn--b6gac.eu.org','di.nscl.ir','tr.diam4.ggff.net','bpb.yousef.isegaro.com'];
const REGION_WORDS={HK:['hong kong','hkg'],JP:['japan','tokyo','osaka','chiba','saitama','kanagawa','aichi','fukuoka'],SG:['singapore','sin'],KR:['south korea','korea','seoul','incheon'],US:['united states','usa','california','virginia','oregon','ohio','iowa','new york','texas','washington','illinois'],DE:['germany','frankfurt','berlin','bavaria','hesse']};
const COUNTRY_ZH={HK:'香港',MO:'澳门',TW:'台湾',CN:'中国大陆',JP:'日本',KR:'韩国',SG:'新加坡',VN:'越南',TH:'泰国',MY:'马来西亚',ID:'印度尼西亚',PH:'菲律宾',IN:'印度',AE:'阿联酋',US:'美国',CA:'加拿大',GB:'英国',DE:'德国',FR:'法国',NL:'荷兰',ES:'西班牙',IT:'意大利',PL:'波兰',TR:'土耳其',AU:'澳大利亚',NZ:'新西兰',BR:'巴西'};
const COLO_ZH={HKG:'香港',NRT:'东京',KIX:'大阪',ICN:'首尔',SIN:'新加坡',TPE:'台北',MNL:'马尼拉',BKK:'曼谷',SGN:'胡志明市',HAN:'河内',KUL:'吉隆坡',CGK:'雅加达',BOM:'孟买',DEL:'新德里',DXB:'迪拜',LHR:'伦敦',CDG:'巴黎',FRA:'法兰克福',AMS:'阿姆斯特丹',MAD:'马德里',MXP:'米兰',WAW:'华沙',IST:'伊斯坦布尔',SJC:'圣何塞',LAX:'洛杉矶',SEA:'西雅图',DFW:'达拉斯',ORD:'芝加哥',IAD:'华盛顿',EWR:'纽瓦克',MIA:'迈阿密',ATL:'亚特兰大'};
function esc(v){return String(v??'').replace(/[&<>"']/g,s=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]));}
function countryZh(v){if(!v)return '未识别';const k=String(v).toUpperCase();return COUNTRY_ZH[k]||k;}
function coloZh(v){if(!v)return '-';const k=String(v).toUpperCase();return COLO_ZH[k]?COLO_ZH[k]+'（'+k+'）':k;}
async function api(path,opt={}){const headers={'Content-Type':'application/json',...(opt.headers||{})};if(csrf&&opt.method&&opt.method!=='GET')headers['x-csrf-token']=csrf;const r=await fetch(path,{credentials:'same-origin',...opt,headers});const text=await r.text();let data={};try{data=text?JSON.parse(text):{};}catch{data={detail:text};}if(!r.ok)throw new Error(data.detail||('HTTP '+r.status));return data;}
function validIp(ip){const p=String(ip).trim().split('.');return p.length===4&&p.every(x=>/^\d{1,3}$/.test(x)&&Number(x)>=0&&Number(x)<=255);}
function normalize(ip,port){if(!validIp(ip))return null;const n=Number(port||443);if(n<1||n>65535)return null;return ip+':'+n;}
function parseEndpointLine(line){let v=String(line||'').trim();if(!v)return null;v=v.replace(/^proxyip:\/\//i,'').split(/[\s#|｜＃]/)[0];const m=v.match(/^(\d{1,3}(?:\.\d{1,3}){3})(?::(\d{1,5}))?$/);return m?normalize(m[1],m[2]||443):null;}
function applyPortPolicy(list){const mode=$('portPolicy').value;return list.map(x=>{const m=x.match(/^(\d+(?:\.\d+){3}):(\d+)$/);if(!m)return null;if(mode==='443'&&m[2]!=='443')return null;if(mode==='force443')return m[1]+':443';return x;}).filter(Boolean);}
function dedupe(list){const seen=new Set(),out=[];for(const x of list){const v=String(x||'').trim(),k=v.toLowerCase();if(!v||seen.has(k))continue;seen.add(k);out.push(v);}return out;}
async function fetchText(url){const r=await fetch(url,{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);return r.text();}
function parseCountry(text){const out=[];for(const line of text.split(/\r?\n/)){const m=line.trim().match(/^(\d{1,3}(?:\.\d{1,3}){3})\s+(\d{1,5})$/);if(m){const n=normalize(m[1],m[2]);if(n)out.push(n);continue;}const n=parseEndpointLine(line);if(n)out.push(n);}return out;}
function parseDaily(text,region){const out=[];const words=REGION_WORDS[region]||[];for(const line of text.split(/\r?\n/)){const m=line.match(/<pre><code>(\d{1,3}(?:\.\d{1,3}){3})<\/code><\/pre>/i);if(!m)continue;if(region!=='ALL'&&words.length&&!words.some(w=>line.toLowerCase().includes(w)))continue;const n=normalize(m[1],443);if(n)out.push(n);}return out;}
function parseLoose(text){const out=[];const re=/(\d{1,3}(?:\.\d{1,3}){3})(?::(\d{1,5}))?/g;let m;while((m=re.exec(text))!==null){const n=normalize(m[1],m[2]||443);if(n)out.push(n);}return out;}
async function resolveDns(host){const url='https://cloudflare-dns.com/dns-query?name='+encodeURIComponent(host)+'&type=A';const r=await fetch(url,{headers:{Accept:'application/dns-json'},cache:'no-store'});if(!r.ok)throw new Error('DoH '+r.status);const d=await r.json();return dedupe((d.Answer||[]).map(x=>String(x.data||'').trim()).filter(validIp).map(x=>x+':443'));}
async function resolveDomains(domains){const settled=await Promise.allSettled(domains.map(resolveDns));const out=[];for(const result of settled){if(result.status==='fulfilled')out.push(...result.value);}return dedupe(out);}
async function oneSource(name,regionHint,fn){try{const items=dedupe(applyPortPolicy(await fn()));return {name,regionHint,items,raw:items.length,status:'ok'};}catch(e){return {name,regionHint,items:[],raw:0,status:e.message||String(e)};}}
function renderSourceStats(rows){const seen=new Set();$('sourceBody').innerHTML=rows.map(row=>{let contributed=0;for(const x of row.items){const k=x.toLowerCase();if(!seen.has(k)){seen.add(k);contributed++;}}const st=row.status==='ok'?'<span class="ok">正常</span>':'<span class="bad">'+esc(row.status)+'</span>';return '<tr><td>'+esc(row.name)+'</td><td>'+row.raw+'</td><td>'+contributed+'</td><td>'+st+'</td></tr>';}).join('');}
function buildCandidateMeta(rows){candidateMeta={};for(const row of rows){for(const item of row.items){const k=item.toLowerCase();if(!candidateMeta[k])candidateMeta[k]={sources:[],regionHints:[]};if(!candidateMeta[k].sources.includes(row.name))candidateMeta[k].sources.push(row.name);if(row.regionHint&&!candidateMeta[k].regionHints.includes(row.regionHint))candidateMeta[k].regionHints.push(row.regionHint);}}}
async function loadCandidates(){const region=$('region').value,mode=$('candidateMode').value,work=[];$('fetchBtn').disabled=true;$('scanBtn').disabled=true;$('sourceStatus').textContent='正在并行读取公开来源…';try{
 if($('srcCountry').checked&&region!=='ALL')work.push(oneSource('NiREvil '+region,region,async()=>parseCountry(await fetchText(RAW+'NiREvil/vless/main/sub/country_proxies/'+region+'.txt'))));
 if($('srcDaily').checked)work.push(oneSource('NiREvil Daily',region==='ALL'?null:region,async()=>parseDaily(await fetchText(RAW+'NiREvil/vless/main/sub/ProxyIP-Daily.md'),region)));
 if($('srcCmliu').checked)work.push(oneSource('CMliu '+region,region==='ALL'?null:region,async()=>resolveDns(CMLIU[region]||CMLIU.ALL)));
 if($('srcDynamic').checked&&(mode==='broad'||region==='ALL'||region==='HK'))work.push(oneSource('EDT 动态域名组',null,async()=>resolveDomains(DYNAMIC_DOMAINS)));
 if($('srcCfBest').checked)work.push(oneSource('cf-bestip '+region,region==='ALL'?null:region,async()=>{const file=region==='ALL'?'proxy_all.txt':'proxy_'+region+'.txt';return parseLoose(await fetchText(RAW+'Zoroaaa/cf-bestip/main/public/'+file));}));
 if($('srcLeilao').checked&&(region==='US'||region==='ALL'))work.push(oneSource('LeilaoMi all/best',region==='US'?'US':null,async()=>{const a=await fetchText('https://list.leilaomi.cc.cd/all.txt');const b=await fetchText('https://list.leilaomi.cc.cd/best.txt');return parseLoose(a+'\n'+b);}));
 const rows=await Promise.all(work);renderSourceStats(rows);buildCandidateMeta(rows);let list=dedupe(rows.flatMap(r=>r.items));const limit=Number($('limit').value||0);if(limit>0)list=list.slice(0,limit);allCandidates=list;$('candidates').value=list.length<=300?list.join('\n'):list.slice(0,300).join('\n')+'\n\n… 仅预览前 300 条，实际共 '+list.length+' 条';$('scanBtn').disabled=!list.length;$('copyCandidatesBtn').disabled=!list.length;const failed=rows.filter(r=>r.status!=='ok').length;$('sourceStatus').innerHTML='获取完成：<b>'+list.length+'</b> 条去重候选；来源 '+rows.length+' 个，失败 '+failed+' 个。第三方“可用”标签不作为最终结论。';
 }catch(e){allCandidates=[];$('sourceStatus').innerHTML='<span class="bad">获取失败：'+esc(e.message)+'</span>';}finally{$('fetchBtn').disabled=false;}}
async function startScan(){if(!allCandidates.length)return;const sni=$('sni').value.trim();if(!sni){alert('请填写检测 SNI');return;}$('scanBtn').disabled=true;try{const body={targets:allCandidates.join('\n'),probe_sni:sni,probe_path:cfg.default_probe_path||'/cdn-cgi/trace',generic_sni:'',expect_cloudflare:true,check_concurrency:Number($('concurrency').value),timeout:7,edt_runtime:{enabled:true},speed:{enabled:false}};const d=await api('/api/jobs',{method:'POST',body:JSON.stringify(body)});jobId=d.id;$('stJob').textContent=jobId;pollStart();}catch(e){alert('创建任务失败：'+e.message);$('scanBtn').disabled=false;}}
function pollStart(){clearInterval(timer);poll();timer=setInterval(poll,1000);}
async function poll(){if(!jobId)return;try{current=await api('/api/jobs/'+jobId);render();if(['completed','cancelled','interrupted'].includes(current.state)){clearInterval(timer);timer=null;$('scanBtn').disabled=false;}}catch(e){clearInterval(timer);timer=null;$('scanBtn').disabled=false;alert('读取任务失败：'+e.message);}}
function mark(v){return v===true?'<span class="ok">✓</span>':v===false?'<span class="bad">×</span>':'-';}
function entrancePlace(r){const meta=candidateMeta[String(r.candidate||'').toLowerCase()];if(meta?.regionHints?.length)return countryZh(meta.regionHints[0]);if(r.exit_match==='same'&&r.country)return countryZh(r.country);return '未识别';}
function sourceText(r){const meta=candidateMeta[String(r.candidate||'').toLowerCase()];return meta?.sources?.join(' / ')||'-';}
function endpointHtml(ip,place){return '<div class="endpoint"><span class="ip">'+esc(ip||'-')+'</span><span class="place">'+esc(place||'未识别')+'</span></div>';}
function filteredRows(){let rows=(current?.results||[]).map((r,i)=>({...r,_i:i})).filter(r=>r.final_available!==null&&r.final_available!==undefined);const f=$('resultFilter').value;if(f==='available')rows=rows.filter(r=>r.final_available===true);if(f==='failed')rows=rows.filter(r=>r.final_available===false);const s=$('resultSort').value;if(s==='tcp')rows.sort((a,b)=>(a.tcp_ms??1e12)-(b.tcp_ms??1e12));if(s==='tls')rows.sort((a,b)=>(a.tls_ms??1e12)-(b.tls_ms??1e12));return rows;}
function renderResults(){const rows=filteredRows();$('resultCount').textContent='当前 '+rows.length+' 条';$('tbody').innerHTML=rows.slice(0,1000).map(r=>{const err=r.error||'',errShort=err.length>36?err.slice(0,36)+'…':err;return '<tr class="'+(r.final_available===true?'row-good':'')+'"><td>'+(r._i+1)+'</td><td class="mono">'+esc(r.candidate||r.input)+'</td><td>'+mark(r.final_available)+'</td><td>'+mark(r.edt_available)+'</td><td>'+mark(r.cloudflare_reached)+'</td><td>'+esc(r.tcp_ms??'-')+'</td><td>'+esc(r.tls_ms??'-')+'</td><td>'+endpointHtml(r.host||'-',entrancePlace(r))+'</td><td>'+endpointHtml(r.exit_ip||'-',countryZh(r.country))+'</td><td>'+esc(coloZh(r.colo))+'</td><td><div class="source-tag" title="'+esc(sourceText(r))+'">'+esc(sourceText(r))+'</div></td><td class="error-cell '+(err?'bad':'error-empty')+'" title="'+esc(err)+'">'+esc(errShort||'-')+'</td></tr>';}).join('');}
function render(){const d=current||{};$('stTotal').textContent=d.total||0;$('stDone').textContent=d.completed||0;$('stFinal').textContent=d.final_available??d.available??0;$('stRuntime').textContent=(d.runtime_completed||0)+'/'+(d.runtime_total||0);$('stState').textContent=d.state||'-';$('stopBtn').disabled=!['queued','checking','runtime_checking','speeding'].includes(d.state);const good=(d.results||[]).filter(r=>r.final_available===true);$('copyGoodBtn').disabled=!good.length;renderResults();}
async function copyText(text){try{await navigator.clipboard.writeText(text);return true;}catch{const ta=document.createElement('textarea');ta.value=text;document.body.appendChild(ta);ta.select();const ok=document.execCommand('copy');ta.remove();return ok;}}
$('fetchBtn').onclick=loadCandidates;$('scanBtn').onclick=startScan;$('copyCandidatesBtn').onclick=async()=>{if(await copyText(allCandidates.join('\n')))alert('已复制 '+allCandidates.length+' 条候选');};$('copyGoodBtn').onclick=async()=>{const good=(current?.results||[]).filter(r=>r.final_available===true).map(r=>r.candidate);if(await copyText(good.join('\n')))alert('已复制 '+good.length+' 条最终可用 ProxyIP');};$('stopBtn').onclick=async()=>{if(!jobId)return;try{await api('/api/jobs/'+jobId+'/cancel',{method:'POST'});$('stopBtn').disabled=true;}catch(e){alert(e.message);}};$('resultFilter').onchange=renderResults;$('resultSort').onchange=renderResults;
(async function boot(){try{const me=await api('/api/auth/me',{method:'GET'});csrf=me.csrf||'';cfg=await api('/api/config',{method:'GET'});$('sni').value=cfg.default_probe_sni||'';$('main').classList.remove('hidden');const p=new URLSearchParams(location.search),r=(p.get('region')||'HK').toUpperCase();if([...$('region').options].some(o=>o.value===r))$('region').value=r;}catch(e){$('authWarn').classList.remove('hidden');}})();
</script>
</body>
</html>
