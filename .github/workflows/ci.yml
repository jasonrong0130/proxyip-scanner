name: ProxyIP Scanner CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Validate Python and shell
        run: |
          python -m py_compile app.py edt_runtime.py
          bash -n install.sh update.sh uninstall.sh install-cloudflare-tunnel.sh
      - name: Validate web console JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          for source, target in [
              ('static/index.html', '/tmp/index.js'),
              ('static/candidates.html', '/tmp/candidates.js'),
          ]:
              html = Path(source).read_text(encoding='utf-8')
              scripts = re.findall(r'<script>(.*?)</script>', html, re.S)
              assert scripts, f'{source} script missing'
              Path(target).write_text('\n'.join(scripts), encoding='utf-8')
          PY
          node --check /tmp/index.js
          node --check /tmp/candidates.js
      - name: Import application
        run: PROXY_SCANNER_DATA_DIR=/tmp/proxyip-scanner-ci ADMIN_PASSWORD_HASH=x SESSION_SECRET=x python -c "import app; print(app.APP_NAME, app.APP_VERSION)"
      - name: Run lifecycle tests
        run: PROXY_SCANNER_DATA_DIR=/tmp/proxyip-scanner-tests ADMIN_PASSWORD_HASH=x SESSION_SECRET=x python -m unittest discover -s tests -v
      - name: Validate annotated ProxyIP imports
        run: |
          PROXY_SCANNER_DATA_DIR=/tmp/proxyip-scanner-ci ADMIN_PASSWORD_HASH=x SESSION_SECRET=x python - <<'PY'
          import app
          sample = "1.2.3.4:443#香港节点\n1.3.4.5:443# 越南节点\n1.2.3.4:443 #重复"
          assert app.normalized_targets(sample) == ["1.2.3.4:443", "1.3.4.5:443"]
          assert app.normalized_targets("proxyip://8.8.8.8:443 | US；9.9.9.9:443＃HK") == ["8.8.8.8:443", "9.9.9.9:443"]
          print("annotated import cleaning ok")
          PY
